name: Test and deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signaldeck-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22.19.0

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build OpenNext Worker
        run: npm run cf:build

      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/signaldeck-worker-dry-run

      - name: Package deploy artifact
        if: github.event_name != 'pull_request'
        run: tar -czf signaldeck-worker.tgz .open-next

      - name: Upload deploy artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: signaldeck-worker-${{ github.sha }}
          path: signaldeck-worker.tgz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy production Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified Worker
        uses: actions/download-artifact@v4
        with:
          name: signaldeck-worker-${{ github.sha }}

      - name: Extract verified Worker
        run: tar -xzf signaldeck-worker.tgz

      - name: Deploy with Wrangler
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
